<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابات Aboud Store</title>
<meta name="theme-color" content="#1D2930">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aboud Store">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one-column phone app, steel-ink cash card cut like a key blade, brass accent, bottom tab bar */
:root{
  --bg:#EDEFEB;--sf:#FFFFFF;--sf2:#F5F6F3;--ln:#DADFD8;--fg:#172027;--mut:#5C686E;
  --ac:#A06C16;--ac-fg:#FFFFFF;--ac-soft:#F4E9D4;
  --ink:#1D2930;--ink-fg:#F2ECDD;--ink-mut:#AEB9BE;
  --good:#22784A;--bad:#B93C32;--warn:#A9680F;--good-soft:#E1F0E6;--bad-soft:#F7E1DE;
  --fd:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --fb:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1417;--sf:#172024;--sf2:#1D272C;--ln:#2B363C;--fg:#E6EAEA;--mut:#93A0A5;
  --ac:#D8A447;--ac-fg:#1B1405;--ac-soft:#3A2F1B;
  --ink:#24313A;--ink-fg:#F2ECDD;--ink-mut:#A7B3B8;
  --good:#4DBB80;--bad:#E8695E;--warn:#E2A045;--good-soft:#173326;--bad-soft:#3A1F1C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1417;--sf:#172024;--sf2:#1D272C;--ln:#2B363C;--fg:#E6EAEA;--mut:#93A0A5;
  --ac:#D8A447;--ac-fg:#1B1405;--ac-soft:#3A2F1B;
  --ink:#24313A;--ink-fg:#F2ECDD;--ink-mut:#A7B3B8;
  --good:#4DBB80;--bad:#E8695E;--warn:#E2A045;--good-soft:#173326;--bad-soft:#3A1F1C;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.num,.n{font-family:var(--fd);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.top h1{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-family:var(--fb);font-weight:400;font-size:12px;color:var(--mut)}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}
.ibtn svg{width:18px;height:18px;stroke:var(--fg)}

/* cash card */
.cash{background:var(--ink);color:var(--ink-fg);border-radius:16px 16px 0 0;padding:18px 18px 30px;margin-top:4px;border:0;width:100%;text-align:right;display:block;
  clip-path:polygon(0 0,100% 0,100% 100%,44% 100%,40% calc(100% - 10px),35% calc(100% - 10px),31% 100%,24% 100%,20% calc(100% - 13px),15% calc(100% - 13px),11% 100%,0 100%)}
.cash .lbl{font-size:12.5px;color:var(--ink-mut);letter-spacing:.02em}
.cash .big{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1.2;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.cash .big span{font-size:15px;font-weight:400;color:var(--ink-mut);margin-inline-start:6px}
.cash .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cash .split div{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px}
.cash .split .lbl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media (max-width:480px){.cash .split{gap:6px}.cash .split div{padding:7px 8px}.cash .split .lbl{font-size:11px}.cash .split b{font-size:15px!important}}
.cash .split b{display:block;font-family:var(--fd);font-size:17px;font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;text-align:right}
button.stat{width:100%}
.stat .lbl{font-size:12.5px;color:var(--mut)}
.stat b{display:block;font-family:var(--fd);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn{color:var(--warn)}

.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}
.sec-h h2{font-size:15px;font-weight:600}
.sec-h .mut{font-size:12.5px}
.mut{color:var(--mut)}

.primary{width:100%;background:var(--ac);color:var(--ac-fg);border:0;border-radius:12px;padding:14px;font-family:var(--fd);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary:disabled{opacity:.55}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.act{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:500}
.act svg{width:22px;height:22px;stroke:var(--ac)}

.list{background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--ln);width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--fd);font-variant-numeric:tabular-nums;font-weight:600;text-align:left;flex:none}
.row .amt small{display:block;font-family:var(--fb);font-weight:400;font-size:11.5px;color:var(--mut)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln);color:var(--mut);vertical-align:middle}
.tag.sale{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.buy{background:var(--ac-soft);color:var(--ac);border-color:transparent}
.tag.ret{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.low{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.qty{min-width:44px;text-align:center;font-family:var(--fd);font-weight:600;padding:3px 8px;border-radius:8px;background:var(--sf2);font-variant-numeric:tabular-nums}
.qty.low{background:var(--bad-soft);color:var(--bad)}
.empty{padding:22px 16px;text-align:center;color:var(--mut);font-size:14px}
.empty b{display:block;color:var(--fg);font-family:var(--fd);font-weight:600;margin-bottom:4px}

.seg{display:flex;background:var(--sf2);border:1px solid var(--ln);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-size:14px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--sf);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{display:flex;gap:8px;margin:12px 0}
.search input{flex:1;min-width:0}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:none}
.money{font-family:var(--fd);font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
label.f{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addbtn{flex:none;background:var(--ac);color:var(--ac-fg);border:0;border-radius:10px;padding:0 14px;font-weight:600;white-space:nowrap}
.ghost{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;font-size:14px}
.danger{color:var(--bad);background:none;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%;margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 12px;font-size:13px}
.chips button.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--ln)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--fd);font-variant-numeric:tabular-nums}
.kv.tot{font-size:17px;border-bottom:0;padding-top:10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:13px}
.bar{height:7px;border-radius:9px;background:var(--sf2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}

/* invoice editor */
.ed-h{display:flex;align-items:center;gap:10px;padding-block:14px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.ed-h h2{font-size:18px;flex:1}
.res{margin-top:6px}
/* quick entry row: item → qty → price → add, like سهل */
.qe{display:grid;grid-template-columns:1fr 84px 104px auto;gap:8px;align-items:start}
.qe-s{position:relative;min-width:0}
.qe-s .res{position:absolute;inset-inline:0;top:100%;z-index:6;max-height:340px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.qe .primary{width:auto;padding:12px 18px}
.res .row.hi{background:var(--ac-soft)}
.qe-i{min-height:18px;margin:6px 2px 0}
@media (max-width:559px){.qe{grid-template-columns:1fr 1fr auto}.qe-s{grid-column:1/-1}}
@media (min-width:560px){.line{display:grid;grid-template-columns:1fr 300px;column-gap:12px;align-items:center}.line .lin{grid-template-columns:84px 104px 1fr;margin-top:0;grid-row:1/3;grid-column:2}.line .lt{grid-column:1}.line .mini{grid-column:1}}
.line{padding:11px 13px;border-bottom:1px solid var(--ln)}
.line:last-child{border-bottom:0}
.line .lt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.line .lt b{font-weight:500;min-width:0}
.line .lin{display:grid;grid-template-columns:76px 1fr auto;gap:8px;align-items:center;margin-top:7px}
.line .lin input{padding:8px 9px}
.line .x{border:0;background:none;color:var(--bad);font-size:20px;line-height:1;padding:2px 6px}
.line .ltot{font-family:var(--fd);font-weight:600;font-variant-numeric:tabular-nums;min-width:70px;text-align:left}
.mini{font-size:12px;color:var(--mut)}
.quick{display:flex;gap:6px;margin:-4px 0 12px}
.quick button{flex:1;font-size:13px;padding:7px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:10px}

/* nav */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;max-width:720px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--mut)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button.on{color:var(--ac);font-weight:600}

/* sheet */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,16,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--ln);margin:2px auto 12px}
.sheet h3{font-size:18px;margin-bottom:14px}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
pre.share{white-space:pre-wrap;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;font-family:var(--fb);font-size:14px;margin:0 0 10px;max-height:40vh;overflow:auto}
.note{font-size:13px;color:var(--mut);background:var(--sf2);border:1px dashed var(--ln);border-radius:10px;padding:9px 12px;margin-top:12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.login{max-width:400px;margin:0 auto;padding-block:12vh 40px;text-align:center}
.login .bigmark{width:88px;height:88px;border-radius:22px;background:var(--ink);display:grid;place-items:center;margin:0 auto 16px}
.login .bigmark svg{width:52px;height:52px}
.login h1{font-size:26px;margin-bottom:4px}
.login form{text-align:right;margin-top:22px}
.linkbtn{background:none;border:0;color:var(--ac);padding:10px;font-size:14px}
.inst{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;background:var(--ac-soft);border:1px solid transparent;border-radius:12px;padding:10px 12px;text-align:right;color:var(--fg)}
.inst b{font-family:var(--fd);font-weight:600}
.inst .x{margin-inline-start:auto;color:var(--mut);background:none;border:0;font-size:20px;padding:0 4px}
.steps{margin:0;padding-inline-start:20px}.steps li{margin-bottom:6px}
@media (min-width:900px){
 nav.tabs{inset:0 0 0 auto;width:96px;border-top:0;border-left:1px solid var(--ln);padding-top:84px;align-items:flex-start}
 nav.tabs .in{flex-direction:column;gap:4px}
 nav.tabs button{flex:none;padding:12px 4px;font-size:12.5px}
 .app{max-width:880px;margin-left:auto;margin-right:max(112px,calc((100vw - 880px)/2));padding-block-end:48px}
 .toast{bottom:28px}
 .ov{align-items:center}.sheet{border-radius:18px;max-height:86vh}
}
@media (min-width:560px){.acts{grid-template-columns:repeat(6,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}
/* ---------- laptop layout (≥1100px): top menu + full-width sale screen like سهل ---------- */
.dnav{position:fixed;top:0;inset-inline:0;height:50px;z-index:15;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;gap:2px;padding:0 16px}
.dnav .lg{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:16px;margin-inline-end:18px;white-space:nowrap}
.dnav .lg .mark{width:28px;height:28px;background:var(--ac)}
.dnav button{background:none;border:0;color:var(--ink-mut);padding:15px 13px;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.dnav button.on{color:#fff;border-bottom-color:var(--ac);font-weight:600}.dnav button:hover{color:#fff}
.dnav .sp{flex:1}.dnav .dt{color:var(--ink-mut);font-size:12.5px;margin-inline-end:10px}
body.desk nav.tabs{display:none!important}
body.desk .app{max-width:1180px;margin-left:auto!important;margin-right:auto!important;padding-top:58px}
body.desk .app.wide{max-width:none;padding:60px 14px 44px}
body.desk .top{top:50px}
.dk{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.dk-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.dk .card{padding:0}
.dk-hd{display:flex;align-items:center;gap:10px;padding:12px 14px 4px;flex-wrap:wrap}
.dk-hd h2{font-size:18px;margin:0}.dk-no{background:var(--ac-soft);color:var(--ac);border-radius:7px;padding:2px 9px;font-weight:700;font-family:var(--fd)}
.dk-hd .pbox{max-width:380px}.dk-hd .pbox input{padding:9px 10px}.dk-hd .seg{margin-inline-start:auto}.dk-hd .seg button{padding:6px 16px}
.dk .qe{padding:8px 14px 0;grid-template-columns:1fr 110px 120px 110px}
.dk .qe input{height:44px;font-size:15px}.dk .qe .primary{height:44px}
.dk .qe-i{padding:0 14px 10px}
.dk-tb{overflow:auto;max-height:calc(100vh - 420px);min-height:180px}
.dk-tb table{width:100%;border-collapse:collapse}
.dk-tb th{position:sticky;top:0;background:var(--sf2);color:var(--mut);font-weight:500;font-size:12.5px;padding:9px 6px;border-bottom:1px solid var(--ln);text-align:center;z-index:1}
.dk-tb td{padding:6px;border-bottom:1px solid var(--ln);text-align:center;font-variant-numeric:tabular-nums}
.dk-tb td.n{text-align:right;font-weight:600}.dk-tb td input{width:100%;max-width:110px;padding:6px 8px;text-align:center}
.dk-tb td.tt{font-family:var(--fd);font-weight:600}.dk-tb .x{border:0;background:none;color:var(--bad);font-size:20px}
.dk-tb tr.last td{background:var(--ac-soft)}.dk-tb .emp td{padding:34px;color:var(--mut)}
.dk-ft{display:flex;gap:22px;padding:9px 14px;color:var(--mut);font-size:13px;border-top:1px solid var(--ln)}.dk-ft b{color:var(--fg)}
.dk .dk-tl{padding:10px 14px 12px}.dk-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.dk-cats button{border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:5px 14px;color:var(--mut);font-size:13px}.dk-cats button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;max-height:170px;overflow:auto}
.dk-grid button{border:1px solid var(--ln);border-radius:9px;padding:7px 9px;background:var(--sf2);text-align:right;min-width:0}
.dk-grid .qt{position:relative;min-width:0}.dk-grid .qt>button:first-child{width:100%;height:100%}.dk-grid .pin{position:absolute;top:3px;left:3px;border:0!important;background:none!important;padding:2px 4px!important;font-size:15px;line-height:1;color:var(--mut)}.dk-grid .pin.on{color:#c98a00}.dk-grid .qt>button:first-child b{padding-left:18px}
.qsg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);margin:0 0 8px}.qsg button{border:1px dashed var(--ac);color:var(--ac);background:var(--ac-soft);border-radius:16px;padding:3px 10px;font-size:12.5px}
.cnt-bar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;background:var(--bg);padding:10px 0;margin-top:12px;border-top:1px solid var(--ln)}.cnt-bar span{flex:1;font-size:13px;color:var(--mut)}
.cnt-in.ch{border-color:var(--ac);background:var(--ac-soft);font-weight:700}
.qpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}.qpick>button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ln);border-radius:10px;padding:8px 10px;background:var(--sf);text-align:right;min-width:0}
.qpick>button.on{border-color:var(--ac);background:var(--ac-soft)}.qpick .ck{flex:none;width:20px;height:20px;border:1.5px solid var(--ln);border-radius:5px;display:grid;place-items:center;font-size:13px;color:#fff}.qpick .on .ck{background:var(--ac);border-color:var(--ac)}
.qpick .nm{min-width:0}.qpick b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qpick small{color:var(--mut);font-size:11.5px}

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[,،\s]/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>r2(n).toLocaleString('en-US',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());
const sum=(a,k)=>a.reduce((s,x)=>s+(+(typeof k==='function'?k(x):x[k])||0),0);
const tm=ts=>{const d=new Date(ts);return d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})};
const dshort=day=>{const [y,m,d]=day.split('-');return `${+d}/${+m}`};
const EXP_CATS=['إيجار','كهرباء ومياه','مرتبات','نقل وشحن','أكل ومشروبات','صيانة','مستلزمات المحل','أخرى'];
const MOVE={expense:'مصروف',collect:'تحصيل من عميل',pay:'سداد لمورد',in:'إيداع في الخزنة',out:'سحب من الخزنة',transfer:'تحويل بين الخزن',adj:'تسوية رصيد الخزنة',padj:'ضبط رصيد حساب',close:'تقفيل ← الخزنة'};
/* three money boxes: the counter drawer (درج النقدية) takes the day's cash sales; closing it moves the money to the main cash (كاش) */
const W={drawer:'درج النقدية',cash:'الخزنة',insta:'إنستاباي',voda:'فودافون كاش'},WK=['drawer','cash','insta','voda'];
const EW=['insta','voda']; /* electronic wallets. An invoice can be split: cash (drawer/cash) + insta + voda. Old invoices: «insta» amount went to inv.instaW */
const paidOf=i=>r2((+i.cash||0)+(+i.insta||0)+(+i.voda||0));
/* payment parts of a saved invoice: [[box, amount], ...] (non-zero only) */
const payParts=i=>[[i.cashW||'cash',+i.cash||0],[i.instaW||'insta',+i.insta||0],['voda',+i.voda||0]].filter(x=>x[1]);
const mvTo=m=>m.to||(m.method==='insta'?'cash':'insta'); /* old transfers had no «to»: cash<->insta */
const defCW=k=>k==='buy'?'cash':'drawer'; /* which box the cash of an invoice goes in/out of by default */

const S={view:'home',mode:'loading',loaded:false,shop:null,products:[],parties:[],invoices:[],moves:[],
  ptab:'c',itab:'sale',iq:'',sq:'',scat:'',pq:'',rng:'month',from:'',to:'',draft:null,busy:false,sheetOpen:false};
let base=null;const LKEY='aboud-store-books-v1';
/* بداية الحسابات: invoices and moves older than this are hidden everywhere (reports, lists, statements) — never deleted.
   Default = the moment he asked to start fresh (7 Nov 2026, 1:27 PM Cairo). 0 in the settings = show everything again. */
const START0=Date.UTC(2026,10,7,11,27);
const startTs=()=>S.shop&&S.shop.startTs!=null?+S.shop.startTs:START0;
const vis=a=>{const t=startTs();return t?a.filter(x=>(+x.ts||0)>=t):a};

/* ---------- storage ---------- */
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({shop:S.shop,products:S.products,parties:S.parties,invoices:S.invoices,moves:S.moves}))}catch(e){}}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LKEY))}catch(e){return null}}
async function put(col,obj){
  if(col==='shop')S.shop=obj;else{const a=S[col],i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.unshift(obj)}
  if(S.mode==='cloud'){(col==='shop'?base.set(obj):C(col).doc(obj.id).set(obj)).catch(wfail)}else saveLocal();
}
async function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(S.mode==='cloud')C(col).doc(id).delete().catch(wfail);else saveLocal();
}
async function fetchWhere(col,field,op,val,field2,op2,val2){
  if(S.mode!=='cloud'){const t=(x,f,o,v)=>o==='=='?x[f]===v:o==='>='?x[f]>=v:x[f]<=v;return vis(S[col].filter(x=>t(x,field,op,val)&&(!field2||t(x,field2,op2,val2))))}
  let q=C(col).where(field,op,val);if(field2)q=q.where(field2,op2,val2);
  const s=await q.limit(1000).get();const r=s.docs.map(d=>({...d.data()}));return col==='invoices'||col==='moves'?vis(r):r;
}
function sortAll(){S.products.sort((a,b)=>a.name.localeCompare(b.name,'ar'));S.parties.sort((a,b)=>a.name.localeCompare(b.name,'ar'));S.invoices.sort((a,b)=>b.ts-a.ts);S.moves.sort((a,b)=>b.ts-a.ts)}
const P=id=>S.products.find(x=>x.id===id);
const PT=id=>S.parties.find(x=>x.id===id);

function wfail(e){console.error(e);toast(e&&e.code==='permission-denied'?'السيرفر رفض الحفظ (صلاحيات). ابعتلي الرسالة دي.':'الحفظ ما اكتملش: '+((e&&e.code)||'خطأ'))}
let AU=null,FS=null,UP='';
const C=name=>FS.collection(UP+name); /* users/<uid>/products, parties, invoices, moves */
async function init(){
  if(!window.firebase){S.err='محتاج نت أول مرة عشان البرنامج يحمّل. اتأكد من النت وافتحه تاني.';S.loaded=true;render();return}
  firebase.initializeApp({apiKey:"AIzaSyDRpM2CTy_2cYl26zFU2EP4FpJAeS39ZxQ",authDomain:"aboud-store-3526a.firebaseapp.com",projectId:"aboud-store-3526a",
    storageBucket:"aboud-store-3526a.firebasestorage.app",messagingSenderId:"864500940344",appId:"1:864500940344:web:8669b62e69e9b0276e30cd"});
  FS=firebase.firestore();
  try{FS.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await FS.enablePersistence({synchronizeTabs:true})}catch(e){}
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){if(AU){location.reload();return}S.auth='out';S.loaded=true;render();return}
    if(AU&&AU.uid===u.uid)return;
    AU=u;S.auth='in';S.loaded=false;S.mode='cloud';base=FS.doc('users/'+u.uid+'/settings/shop');UP='users/'+u.uid+'/';render();subscribe();
  });
}
function loginErr(c){return({'auth/invalid-credential':'الإيميل أو الباسورد غلط.','auth/wrong-password':'الباسورد غلط.','auth/user-not-found':'الإيميل ده مش متسجّل.','auth/invalid-email':'اكتب الإيميل صح.','auth/too-many-requests':'محاولات كتير. استنى شوية وجرّب تاني.','auth/network-request-failed':'مفيش نت. اتأكد من الاتصال.'})[c]||'ما قدرتش أدخل ('+c+').'}
function vLogin(){return `<div class="login"><div class="bigmark">${KEY}</div><h1>Aboud Store</h1><p class="mut" style="margin:0">حسابات المحل</p>
<form id="lf"><label class="f"><span>الإيميل</span><input id="l_em" type="email" autocomplete="username" class="money" required></label>
<label class="f"><span>الباسورد</span><input id="l_pw" type="password" autocomplete="current-password" class="money" required></label>
<div id="l_err"></div><button class="primary" id="l_btn">دخول</button></form>
<button class="linkbtn" data-a="forgot">نسيت الباسورد؟</button>
<p class="mut" style="font-size:13px;margin-top:18px">ادخل بإيميل وباسورد حساب المحل. لو نسيت الباسورد، اكتب الإيميل واضغط «نسيت الباسورد».</p></div>`}
function subscribe(){
  const got=new Set(),need=5;let timer=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
  const mark=k=>{got.add(k);if(!S.loaded&&got.size>=need){S.loaded=true;clearTimeout(timer);render()}else if(S.loaded)soft()};
  const fail=e=>{console.error(e);S.err=e&&e.code==='permission-denied'?'حسابك مش مسموحله يقرا بيانات المحل من السيرفر (صلاحيات Firebase). ابعتلي الرسالة دي وأنا أظبطها.':'مش قادر أوصل للبيانات دلوقتي. اقفل البرنامج وافتحه تاني بعد شوية.';S.loaded=true;render()};
  let subIM=false; /* invoices & moves wait for the shop doc, so the start point (startTs) is known before filtering */
  base.onSnapshot(s=>{S.shop=s.exists?{...s.data()}:null;mark('shop');if(!subIM){subIM=true;subIMgo()}},fail);
  function subIMgo(){
  C('products').limit(1000).onSnapshot(s=>{S.products=s.docs.map(d=>({...d.data()}));sortAll();mark('p')},fail);
  C('parties').limit(1000).onSnapshot(s=>{S.parties=s.docs.map(d=>({...d.data()}));sortAll();mark('c')},fail);
  C('invoices').orderBy('ts','desc').limit(300).onSnapshot(s=>{S.invoices=vis(s.docs.map(d=>({...d.data()})));mark('i')},fail);
  C('moves').orderBy('ts','desc').limit(300).onSnapshot(s=>{S.moves=vis(s.docs.map(d=>({...d.data()})));mark('m')},fail);}
}
function soft(){if(S.view==='inv'||S.sheetOpen||S.busy)return;render()}

/* ---------- business logic ---------- */
/* st: stock direction, w: money direction into the safe, b: direction on the party's balance */
const KD={sale:{st:-1,w:1,b:1,pt:'c'},buy:{st:1,w:-1,b:1,pt:'s'},rsale:{st:1,w:-1,b:-1,pt:'c'},rbuy:{st:-1,w:1,b:-1,pt:'s'}};
const KN={sale:'بيع',buy:'شراء',rsale:'مرتجع بيع',rbuy:'مرتجع شراء'};
const isRet=k=>k==='rsale'||k==='rbuy';
/* cost of selling q pieces: the pieces on the system go at the average cost; any pieces beyond what's on the system
   (stock is wrong until the جرد) go at the last purchase price, so profit stays close to the truth */
function effCost(p,q){if(!p)return 0;q=num(q);const base=p.cost||p.lastCost||0,last=p.lastCost||p.cost||0,av=Math.max(0,num(p.qty));
  if(!q||q<=av)return base;return r2((av*base+(q-av)*last)/q)}
const lineCost=(l,k)=>l.cost!=null?l.cost:(k==='sale'?effCost(P(l.pid),l.qty):(P(l.pid)?.cost||0));
const lineTot=l=>num(l.qty)*num(l.price)-num(l.disc); /* l.disc: discount on the whole line (laptop screen) */
function calc(d){
  const sub=r2(sum(d.lines,lineTot));const disc=num(d.disc);const total=r2(sub-disc);
  const cash=num(d.cash),insta=num(d.insta),voda=num(d.voda);const rest=r2(total-cash-insta-voda);
  const cost=r2(sum(d.lines,l=>num(l.qty)*lineCost(l,d.kind)));
  const profit=d.kind==='sale'?r2(total-cost):d.kind==='rsale'?r2(-(total-cost)):0;
  return{sub,disc,total,cash,insta,voda,rest,cost,profit};
}
async function applyInvoice(inv,sign){
  const k=KD[inv.kind];
  for(const l of inv.lines){
    const p0=P(l.pid);if(!p0)continue;const p={...p0};
    if(k.st>0){ /* stock coming in: purchase, or goods a customer returned */
      const unit=inv.kind==='buy'?l.price:(l.cost!=null?l.cost:p.cost);
      if(sign>0){const nq=r2(p.qty+l.qty);p.cost=r2(p.qty>0&&nq>0?(p.qty*p.cost+l.qty*unit)/nq:unit);p.qty=nq;if(inv.kind==='buy')p.lastCost=l.price}
      else{const nq=r2(p.qty-l.qty);if(nq>0)p.cost=r2(Math.max(0,(p.qty*p.cost-l.qty*unit)/nq));p.qty=nq}
    }else p.qty=r2(p.qty-sign*l.qty); /* stock going out: sale, or goods returned to a supplier */
    await put('products',p);
  }
  const sh={...S.shop};
  const cw=inv.cashW||'cash';sh[cw]=r2((sh[cw]||0)+sign*k.w*inv.cash);const iw=inv.instaW||'insta';sh[iw]=r2((sh[iw]||0)+sign*k.w*inv.insta);if(inv.voda)sh.voda=r2((sh.voda||0)+sign*k.w*inv.voda);
  if(sign>0&&inv.no>(sh.seq||0))sh.seq=inv.no;
  await put('shop',sh);
  const pt=inv.partyId&&PT(inv.partyId);
  if(pt&&inv.rest){await put('parties',{...pt,bal:r2(pt.bal+sign*k.b*inv.rest)})}
}
async function getInv(id){
  const loc=S.invoices.find(x=>x.id===id);if(loc)return loc;
  if(S.mode!=='cloud')return null;
  const s=await C('invoices').doc(id).get();return s.exists?{...s.data()}:null;
}
/* how much of each line of an original invoice can still be returned */
const remaining=(orig,i)=>r2(orig.lines[i].qty-((orig.ret||{})[i]||0));
async function markReturned(ret,sign){
  if(!ret.ref)return;const o=await getInv(ret.ref);if(!o)return;
  const r={...(o.ret||{})};ret.lines.forEach(l=>{if(l.ri!=null)r[l.ri]=r2((r[l.ri]||0)+sign*l.qty)});
  await put('invoices',{...o,ret:r});
}
async function applyMove(m,sign){
  if(m.type==='padj'){const pt=PT(m.partyId);if(pt)await put('parties',{...pt,bal:r2(pt.bal+sign*m.amount)});return} /* account balance set by hand (count / opening) — no cash */
  const sh={...S.shop},k=W[m.method]?m.method:'cash';
  if(m.type==='transfer'||m.type==='close'){const o=mvTo(m);sh[k]=r2((sh[k]||0)-sign*m.amount);sh[o]=r2((sh[o]||0)+sign*m.amount)}
  else{const dl={collect:1,in:1,adj:1,expense:-1,pay:-1,out:-1}[m.type];sh[k]=r2((sh[k]||0)+sign*dl*m.amount)}
  await put('shop',sh);
  const pt=m.partyId&&PT(m.partyId);
  if(pt&&(m.type==='collect'||m.type==='pay'))await put('parties',{...pt,bal:r2(pt.bal-sign*m.amount)});
}
async function guard(fn){
  if(S.busy)return;S.busy=true;document.querySelectorAll('[data-save]').forEach(b=>b.disabled=true);
  try{await fn()}catch(e){toast(e?.code==='quota_exceeded'?'المساحة اتملت، امسح حاجات قديمة':'حصلت مشكلة في الحفظ، جرّب تاني');console.error(e)}
  finally{S.busy=false;document.querySelectorAll('[data-save]').forEach(b=>b.disabled=false)}
}

  if(!S.loaded){app.innerHTML=`<div class="empty" style="margin-top:40vh"><b>بيفتح الحسابات…</b>${S.slow?'البيانات متأخرة شوية، اتأكد إن النت شغال.':''}</div>`;return}
  if(S.err){$('#tabs').hidden=true;app.innerHTML=`<div class="empty" style="margin-top:35vh"><b>فيه مشكلة</b>${esc(S.err)}</div>`;return}

async function saveInvoice(next){
  const d0=S.draft;if(d0.pm)syncPay(d0);if(!d0.partyId&&!isRet(d0.kind)&&!num(d0.cash))d0.cash=String(Math.max(0,r2(calc(d0).total-num(d0.insta)-num(d0.voda)))); /* cash customer: whatever isn't transfer is cash */
  const d=S.draft,c=calc(d),K=KD[d.kind],cust=K.pt==='c',rt=isRet(d.kind),err=$('#d_err');d.note=$('#d_note')?.value||'';
  const fail=m=>{err.innerHTML=`<div class="err">${m}</div>`;err.scrollIntoView({block:'center'})};
  const lines=d.lines.filter(l=>num(l.qty)>0);
  if(!lines.length)return fail(rt?'ضيف صنف راجع واحد على الأقل بكمية أكبر من صفر.':'ضيف صنف واحد على الأقل بكمية أكبر من صفر.');
  const big=lines.find(l=>l.max!=null&&num(l.qty)>l.max+0.001);
  if(big)return fail(`«${esc(big.name)}»: اللي ممكن يرجع من الفاتورة الأصلية ${fmt(big.max)} بس.`);
  if(c.total<0)return fail('الخصم أكبر من إجمالي الفاتورة.');
  if(c.rest<-0.001)return fail(rt?'الفلوس الراجعة أكتر من قيمة المرتجع.':'المدفوع أكتر من المطلوب. راجع الكاش والتحويلات.');
  if(c.rest>0.001&&!d.partyId)return fail(rt?`مفيش حساب يتخصم منه ${fmt(c.rest)}. اكتب الفلوس اللي رجعت كاملة، أو اختار ${cust?'العميل':'المورد'}.`:`فيه باقي ${fmt(c.rest)}. اختار ${cust?'العميل':'المورد'} عشان يتسجل على حسابه، أو خلّي الدفع كامل.`);
  const pt=PT(d.partyId);
  const inv={id:uid(),no:(S.shop.seq||0)+1,kind:d.kind,ts:Date.now(),day:today(),partyId:d.partyId||'',partyName:pt?pt.name:(cust?'عميل نقدي':'مورد نقدي'),
    lines:lines.map(l=>{const q=num(l.qty),ld=num(l.disc);const o={pid:l.pid,name:l.name,qty:q,price:ld?Math.round((num(l.price)-ld/q)*10000)/10000:num(l.price),cost:lineCost(l,d.kind)};if(ld){o.list=num(l.price);o.ld=ld}if(l.ri!=null)o.ri=l.ri;return o}),
    sub:c.sub,disc:c.disc,total:c.total,cash:c.cash,cashW:d.cashW||'cash',insta:c.insta,instaW:'insta',voda:c.voda,rest:r2(c.rest),profit:c.profit,note:d.note};
  if(d.ref){inv.ref=d.ref;inv.refNo=d.refNo}
  if(d.edit){const old=S.invoices.find(x=>x.id===d.edit);if(!old)return fail('مش لاقي الفاتورة القديمة. اقفل وافتحها تاني.');
    if(Object.values(old.ret||{}).some(v=>v>0))return fail('الفاتورة دي عليها مرتجع. امسح المرتجع الأول وبعدين عدّلها.');
    Object.assign(inv,{id:old.id,no:old.no,ts:old.ts,day:old.day,instaW:d.instaW||'insta',edited:Date.now(),edits:(old.edits||0)+1});
    await guard(async()=>{
      await applyInvoice(old,-1);await markReturned(old,-1); /* undo the old invoice: stock, money, account */
      const p2=PT(inv.partyId);if(p2){inv.balBefore=r2(p2.bal);inv.balAfter=r2(p2.bal+K.b*inv.rest)}
      await applyInvoice(inv,1);await put('invoices',inv);await markReturned(inv,1);
      if(next==='print')printInvoice(inv);
      S.draft=null;S.view='invoices';S.itab=rt?'ret':d.kind;render();toast(`اتعدّلت ${rt?KN[d.kind]:'فاتورة '+KN[d.kind]} رقم ${inv.no} ✓`);showInvoice(inv.id)});
    return}
  if(pt){inv.balBefore=r2(pt.bal);inv.balAfter=r2(pt.bal+K.b*inv.rest)}
  await guard(async()=>{await applyInvoice(inv,1);await put('invoices',inv);await markReturned(inv,1);
    if(next==='print')printInvoice(inv);
    if(next){S.draft=null;newDraft(d.kind);if(d.pt)S.draft.pt=d.pt;S.draft.cashW=d.cashW;if(d.pm&&d.pm!=='credit'&&d.pm!=='split')S.draft.pm=d.pm,S.draft.paid='';render();toast(`اتحفظت فاتورة ${KN[d.kind]} رقم ${inv.no} ✓`);setTimeout(()=>$('#d_q')?.focus(),50);return}
    S.draft=null;S.view=d.kind==='sale'?'home':'invoices';S.itab=rt?'ret':d.kind;render();toast(`اتحفظ ${rt?KN[d.kind]:'فاتورة '+KN[d.kind]} رقم ${inv.no}`);showInvoice(inv.id)});
}

const IMPF={name:['اسم الصنف',['اسم الصنف','الصنف','صنف','بيان','وصف','اسم','name','item']],code:['الكود / الباركود',['كود','باركود','رقم الصنف','code','barcode','sku']],

  qty:['الكمية',['كمية','رصيد','الموجود','العدد','qty','quantity','stock']],price:['سعر القطاعي',['قطاعي','بيع','مستهلك','سعر','price','retail']],
  price2:['سعر الجملة',['جملة','wholesale']],min:['حد التنبيه',['حد','طلب','min','reorder']]};

let IMP=null;
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function importSheet(){IMP=null;openSheet(`<h3>استيراد الأصناف</h3><p class="mut" style="margin:0 0 12px">من «سهل» صدّر قائمة الأصناف أو أرصدة المخزن لملف Excel، وارفعه هنا. لازم يكون فيه عمود لاسم الصنف، والباقي اختياري.</p>
<input type="file" id="imp_file" accept=".xlsx,.xls,.csv"><div id="imp_body"></div>`);loadXLSX().catch(()=>{})}
async function readImportFile(f){
  const body=$('#imp_body');body.innerHTML='<div class="empty">بيقرا الملف…</div>';
  try{await loadXLSX()}catch(e){body.innerHTML='<div class="err">مش قادر أحمّل قارئ ملفات Excel دلوقتي. اتأكد من النت وجرّب تاني.</div>';return}
  let rows;
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const sheets=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:true}));
    rows=sheets.sort((a,b)=>b.length-a.length)[0]||[]}
  catch(e){body.innerHTML='<div class="err">الملف ده مش مقروء. احفظه من Excel بصيغة .xlsx أو .csv وارفعه تاني.</div>';return}
  const allKw=Object.values(IMPF).flatMap(x=>x[1]);
  let hi=0,best=-1;rows.slice(0,15).forEach((r,i)=>{const sc=r.filter(c=>{const t=String(c).trim().toLowerCase();return t&&allKw.some(k=>t.includes(k))}).length;if(sc>best){best=sc;hi=i}});
  const head=(rows[hi]||[]).map((c,i)=>String(c).trim()||`عمود ${i+1}`);
  const map={},used=new Set(),data=rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==''));
  const filled=j=>data.some(r=>String(r[j]??'').trim()!==''),tot=h=>/^(ال)?إجمالي|^اجمالي|^total/i.test(h);
  /* skip empty columns (e.g. an unused «كود الصنف 1») and «إجمالي …» value columns for prices/cost */
  IMP_ORDER.forEach(k=>{for(const kw of IMPF[k][1]){const i=head.findIndex((h,j)=>!used.has(j)&&h.toLowerCase().includes(kw)&&filled(j)&&(k==='qty'||k==='name'||!tot(h)));if(i>=0){map[k]=i;used.add(i);return}}});
  IMP={head,data,map,file:f.name};
  renderImport();
}
function impItems(){const {data,map}=IMP;if(map.name==null)return[];
  const g=(r,k)=>map[k]!=null?r[map[k]]:'';
  return data.map(r=>({name:String(g(r,'name')).trim(),code:String(g(r,'code')).trim(),cat:String(g(r,'cat')).trim(),cost:num(g(r,'cost')),qty:num(g(r,'qty')),price:num(g(r,'price')),price2:num(g(r,'price2')),min:num(g(r,'min'))}))
    .filter(x=>x.name&&!/^(ال)?إجمالي|^الاجمالي|^total/i.test(x.name));}
function renderImport(){
  const it=impItems(),body=$('#imp_body');if(!body)return;
  const exist=it.filter(x=>S.products.some(p=>(x.code&&p.code===x.code)||p.name===x.name)).length;
  body.innerHTML=`<div class="note" style="margin:12px 0">${esc(IMP.file)} · ${IMP.data.length} صف</div>
<div class="sec-h"><h2>كل عمود يروح فين؟</h2></div><div class="card">${Object.entries(IMPF).map(([k,[lbl]])=>`<label class="f" style="display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-bottom:8px"><span style="margin:0">${lbl}${k==='name'?' *':''}</span><select data-imp="${k}"><option value="">— مش موجود —</option>${IMP.head.map((h,i)=>`<option value="${i}" ${IMP.map[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div>
${it.length?`<div class="sec-h" style="margin-top:14px"><h2>معاينة</h2><span class="mut">${it.length} صنف${exist?` · ${exist} موجودين قبل كده`:''}</span></div>
<div class="list">${it.slice(0,5).map(x=>`<div class="row"><div class="main"><div class="t">${esc(x.name)}</div><div class="s">${x.code?esc(x.code)+' · ':''}تكلفة ${fmt(x.cost)} · بيع ${fmt(x.price)}${x.price2?' · جملة '+fmt(x.price2):''}</div></div><span class="qty">${fmt(x.qty)}</span></div>`).join('')}</div>
${exist?`<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="imp_upd" checked style="width:auto"> حدّث الأصناف الموجودة (نفس الكود أو الاسم) بالأسعار والكمية اللي في الملف</label>`:''}
${S.products.length+it.length-exist>1000?'<div class="err" style="margin-top:12px">العدد هيعدّي 1,000 صنف، والنسخة دي بتعرض أول 1,000 بس. قولّي وأنا أوسّعها قبل ما تستورد.</div>':''}
<div class="note">الكميات اللي هتدخل بالاستيراد بتعتبر رصيد أول المدة، ومش هتأثر على الخزنة.</div>
<div id="imp_prog"></div><button class="primary" style="margin-top:12px" data-a="imprun" data-save>استورد ${it.length} صنف</button>`:`<div class="err" style="margin-top:12px">${IMP.map.name==null?'اختار العمود اللي فيه اسم الصنف.':'مفيش أصناف في العمود ده.'}</div>`}`;
}
async function runImport(){
  const it=impItems();if(!it.length)return;const upd=$('#imp_upd')?.checked!==false;
  let done=0,added=0,updated=0,skipped=0;const prog=$('#imp_prog');
  const write=async p=>{for(let t=0;t<6;t++){try{await put('products',p);return}catch(e){if(e?.code==='resource_exhausted'||e?.code==='unavailable'){await new Promise(r=>setTimeout(r,1500*(t+1)));continue}throw e}}throw {code:'unavailable'}};
  await guard(async()=>{
    for(const x of it){
      const old=S.products.find(p=>(x.code&&p.code===x.code)||p.name===x.name);
      if(old&&!upd){skipped++}
      else if(old){await write({...old,name:x.name,code:x.code||old.code,cat:x.cat||old.cat,cost:IMP.map.cost!=null?x.cost:old.cost,qty:IMP.map.qty!=null?x.qty:old.qty,price:IMP.map.price!=null?x.price:old.price,price2:IMP.map.price2!=null?x.price2:old.price2,min:IMP.map.min!=null?x.min:old.min});updated++}
      else{await write({id:uid(),created:Date.now(),...x,min:IMP.map.min!=null?x.min:2});added++}
      done++;if(prog&&done%5===0)prog.innerHTML=`<div class="note">اتسجل ${done} من ${it.length}…</div>`;
    }
    sortAll();closeSheet();toast(`اتضاف ${added} صنف${updated?` واتحدّث ${updated}`:''}${skipped?` · اتساب ${skipped}`:''}`);
  });
}

async function readPImportFile(f){
  const body=$('#pimp_body');body.innerHTML='<div class="empty">بيقرا الملف…</div>';
  try{await loadXLSX()}catch(e){body.innerHTML='<div class="err">مش قادر أحمّل قارئ ملفات Excel دلوقتي. اتأكد من النت وجرّب تاني.</div>';return}
  let rows;
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:true})).sort((a,b)=>b.length-a.length)[0]||[]}
  catch(e){body.innerHTML='<div class="err">الملف ده مش مقروء. احفظه من Excel بصيغة .xlsx أو .csv وارفعه تاني.</div>';return}
  const allKw=Object.values(PIMPF).flatMap(x=>x[1]);
  let hi=0,best=-1;rows.slice(0,15).forEach((r,i)=>{const sc=r.filter(c=>{const t=String(c).trim().toLowerCase();return t&&allKw.some(k=>t.includes(k))}).length;if(sc>best){best=sc;hi=i}});
  const head=(rows[hi]||[]).map((c,i)=>String(c).trim()||`عمود ${i+1}`),map={},used=new Set();
  PIMP_ORDER.forEach(k=>{for(const kw of PIMPF[k][1]){const i=head.findIndex((h,j)=>!used.has(j)&&h.toLowerCase().includes(kw));if(i>=0){map[k]=i;used.add(i);return}}});
  if(map.bal!=null&&(map.deb!=null||map.cred!=null))delete map.bal; /* debit/credit columns win over a single balance column */
  PIMP={head,data:rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!=='')),map,file:f.name,type:S.ptab};
  renderPImport();
}

    case 'settings':settingsSheet();break;
    case 'startnow':confirmSheet('التقارير والفواتير هتبدأ من الصفر من دلوقتي. القديم بيستخبى بس ومش بيتمسح، وتقدر ترجّعه من الإعدادات.',async()=>{await put('shop',{...S.shop,startTs:Date.now()});closeSheet();location.reload()},'أيوه، ابدأ من دلوقتي');break;
    case 'startall':await guard(()=>put('shop',{...S.shop,startTs:0}));closeSheet();location.reload();break;
    case 'install':if(e.target.closest('.x'))break;installSheet();break;
    case 'noinst':S.noInst=true;try{localStorage.setItem('as-noinst','1')}catch(_){}render();break;
    case 'logout':confirmSheet('هتخرج من الحساب على الجهاز ده. البيانات محفوظة على السيرفر.',async()=>{await firebase.auth().signOut()},'خروج');break;
    case 'forgot':{const em=$('#l_em')?.value.trim();if(!em){$('#l_err').innerHTML='<div class="err">اكتب الإيميل الأول وبعدين اضغط «نسيت الباسورد».</div>';break}
      firebase.auth().sendPasswordResetEmail(em).then(()=>toast('اتبعت لينك تغيير الباسورد على '+em)).catch(x=>$('#l_err').innerHTML=`<div class="err">${loginErr(x.code)}</div>`);break}
    case 'savesettings':{const n=$('#s_name').value.trim();await guard(()=>put('shop',{...S.shop,name:n||S.shop.name,phone:$('#s_phone').value.trim(),addr:$('#s_addr').value.trim(),foot:$('#s_foot').value.trim(),printSize:$('#s_ps .on')?.dataset.k==='80'?'80':'a4'}));closeSheet();toast('اتحفظت الإعدادات');break}
    case 'itab':S.itab=ds.k;render();break;
    case 'ptab':S.ptab=ds.k;render();break;
    case 'scat':S.scat=ds.k;render();break;
    case 'rng':S.rng=ds.k;render();break;
    case 'copy':{const t=$('#sharetxt').textContent;try{await navigator.clipboard.writeText(t);toast('اتنسخ، الصقه في الواتساب')}catch(_){const r=document.createRange();r.selectNodeContents($('#sharetxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('النص متعلّم، انسخه')}break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='iq'){S.iq=t.value;const l=$('#ilist');const v=vInvoices();const tmp=document.createElement('div');tmp.innerHTML=v;l.innerHTML=tmp.querySelector('#ilist').innerHTML}
  else if(id==='sq'){S.sq=t.value;const tmp=document.createElement('div');tmp.innerHTML=vStock();$('#slist').innerHTML=tmp.querySelector('#slist').innerHTML}
  else if(id==='pq'){S.pq=t.value;const tmp=document.createElement('div');tmp.innerHTML=vParties();$('#plist').innerHTML=tmp.querySelector('#plist').innerHTML}
  else if(id==='d_q'){const d=S.draft;d.q=t.value;d.sel=null;d.hi=0;const r=$('#d_res');r.innerHTML=resHtml();r.hidden=!t.value.trim();$('#d_qi').innerHTML=qeInfo()}
  else if(id==='m_pq'){S.mpid=null;S.mphi=0;const r=$('#m_pres');r.innerHTML=mResHtml();r.hidden=!t.value.trim();$('#m_pinf').innerHTML=''}
  else if(id==='d_eq'||id==='d_ep'){S.draft[id.slice(2)]=t.value}
  else if(id==='d_pq'){const d=S.draft;d.pq=t.value;d.phi=0;const r=$('#d_pres');r.innerHTML=pResHtml();r.hidden=!t.value.trim();if(!t.value.trim()&&d.partyId){d.partyId='';$('#d_pinf').innerHTML=pInfo();refreshTotals()}}
  else if(t.dataset.li!=null){const i=+t.dataset.li,l=S.draft.lines[i];l[t.dataset.f]=t.value;$('#lt'+i).textContent=fmt(lineTot(l));$('#lm'+i).innerHTML=lineMeta(l);refreshTotals()}
  else if(['d_disc','d_cash','d_insta','d_voda','d_scash','d_paid','d_tend'].includes(id)){S.draft[id.slice(2)]=t.value;refreshTotals()}
  else if(id.startsWith('cd_'))cdSum();
  else if(id==='qe_q'){S.qeq=t.value;qsList()}
  else if(id==='cnt_q'){S.cq=t.value;const pos=t.selectionStart;$('#cnt_body').innerHTML=cntBody();const e=$('#cnt_q');e.focus();e.setSelectionRange(pos,pos)}
  else if(t.classList.contains('cnt-in')){const g=t.dataset.g,k=t.dataset.k;if(t.value.trim()==='')delete S.cnt[g][k];else S.cnt[g][k]=t.value;t.classList.toggle('ch',t.value.trim()!=='');cntCount()}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='d_party'){S.draft.partyId=e.target.value;refreshTotals()}
  if(id==='imp_file'&&e.target.files[0])readImportFile(e.target.files[0]);
  if(id==='pimp_file'&&e.target.files[0])readPImportFile(e.target.files[0]);
  if(e.target.dataset.pimp&&PIMP){const k=e.target.dataset.pimp,v=e.target.value;if(v==='')delete PIMP.map[k];else{const n=+v;Object.keys(PIMP.map).forEach(o=>{if(PIMP.map[o]===n)delete PIMP.map[o]});PIMP.map[k]=n}renderPImport()}
  if(e.target.dataset.imp&&IMP){const k=e.target.dataset.imp,v=e.target.value;if(v==='')delete IMP.map[k];else{const n=+v;Object.keys(IMP.map).forEach(o=>{if(IMP.map[o]===n)delete IMP.map[o]});IMP.map[k]=n}renderImport()}
  if(id==='r_from'||id==='r_to'){S[id==='r_from'?'from':'to']=e.target.value;loadReport()}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='lf')return;e.preventDefault();const btn=$('#l_btn');btn.disabled=true;
  firebase.auth().signInWithEmailAndPassword($('#l_em').value.trim(),$('#l_pw').value).catch(x=>{$('#l_err').innerHTML=`<div class="err">${loginErr(x.code)}</div>`;btn.disabled=false});
});
document.addEventListener('keydown',e=>{
  const id=e.target.id,d=S.draft;
  if(id==='m_pq'){const r=$('#m_pres'),items=[...r.querySelectorAll('[data-a=mpick]')];
    if((e.key==='ArrowDown'||e.key==='ArrowUp')&&!r.hidden&&items.length){e.preventDefault();S.mphi=((S.mphi||0)+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle('hi',i===S.mphi))}
    else if(e.key==='Enter'){e.preventDefault();if(items.length)mPick(items[Math.min(S.mphi||0,items.length-1)].dataset.id)}return}
  if(!d)return;
  if(id==='d_pq'){const r=$('#d_pres'),items=[...r.querySelectorAll('[data-a=ppick]')];
    if((e.key==='ArrowDown'||e.key==='ArrowUp')&&!r.hidden&&items.length){e.preventDefault();d.phi=((d.phi||0)+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle('hi',i===d.phi))}
    else if(e.key==='Enter'){e.preventDefault();if(!r.hidden&&items.length)pPick(items[Math.min(d.phi||0,items.length-1)].dataset.id);else $('#d_q')?.focus()}
    else if(e.key==='Escape'){r.hidden=true}return}
  if(id==='d_q'){const r=$('#d_res'),items=[...r.querySelectorAll('[data-a=qpick]')];
    if((e.key==='ArrowDown'||e.key==='ArrowUp')&&!r.hidden&&items.length){e.preventDefault();d.hi=((d.hi||0)+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle('hi',i===d.hi));items[d.hi].scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();if(d.sel){const q=$('#d_eq');q.focus();q.select();return}
      const q=e.target.value.trim().toLowerCase();if(!q)return;const ex=S.products.find(x=>(x.code||'').toLowerCase()===q);
      if(ex)qPick(ex.id);else if(items.length)qPick(items[Math.min(d.hi||0,items.length-1)].dataset.id)}
    else if(e.key==='Escape'){r.hidden=true}}
  else if(id==='d_eq'&&e.key==='Enter'){e.preventDefault();const p=$('#d_ep');p.focus();p.select()}
  else if(id==='d_ep'&&e.key==='Enter'){e.preventDefault();qeAdd()}
});
document.addEventListener('focusout',e=>{if(e.target.id==='d_pq')setTimeout(()=>{const r=$('#d_pres');if(r&&document.activeElement?.id!=='d_pq')r.hidden=true;const d=S.draft,pt=d&&PT(d.partyId),q=$('#d_pq');if(q&&d&&!d.pq)q.value=pt?pt.name:''},150);const t=e.target;if(t.classList?.contains('money')&&t.inputMode==='decimal'&&t.value.trim()!==''){t.value=fmt(num(t.value))}});
try{S.noInst=localStorage.getItem('as-noinst')==='1'}catch(_){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
/* auto-update: when the app comes back to the screen, check for a newer version and reload (unless an invoice or form is open) */
const APPV='15';let updWait=false;
async function checkUpdate(){try{const t=await (await fetch('index.html?v='+Date.now(),{cache:'no-store'})).text();const m=t.match(/const APPV='(\d+)'/);
  if(m&&m[1]!==APPV){if(S.view==='inv'||S.sheetOpen||S.busy){updWait=true;return}location.reload()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
setInterval(()=>{if(updWait&&S.view!=='inv'&&!S.sheetOpen&&!S.busy)location.reload()},5000);
setInterval(checkUpdate,5*60*1000);
init();
</script>
</body>
